# Rebuilds every .html page from _content.py whenever the site source changes.
# So updates only need _content.py (plus any new images) uploaded.
name: Build site

on:
  push:
    branches: [main]
    paths: ['_content.py', '_build.py', '_style.css']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages
        run: python3 _build.py
      - name: Commit rebuilt pages
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Rebuild pages from _content.py"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own"
